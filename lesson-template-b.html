  <!-- 側邊欄收合功能 -->
  <script>
    (function() {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('sidebar-toggle');
      const layout = document.querySelector('.b-layout');
      const storageKey = 'bct-sidebar-collapsed';

      const isCollapsed = localStorage.getItem(storageKey) === 'true';
      if (isCollapsed) {
        layout.classList.add('sidebar-collapsed');
        toggleBtn.querySelector('.toggle-icon').textContent = '▶';
      }

      toggleBtn.addEventListener('click', () => {
        layout.classList.toggle('sidebar-collapsed');
        const collapsed = layout.classList.contains('sidebar-collapsed');
        toggleBtn.querySelector('.toggle-icon').textContent = collapsed ? '▶' : '◀';
        localStorage.setItem(storageKey, collapsed);
      });
    })();
  </script>
  <!-- 筆記欄隱藏功能 -->
  <script>
    (function() {
      const notesToggleBtn = document.getElementById('notes-toggle');
      const layout = document.querySelector('.b-layout');
      const storageKey = 'bct-notes-hidden';

      if (!notesToggleBtn || !layout) return;

      // 更新按鈕位置的函數
      function updateTogglePosition() {
        if (!notesToggleBtn) return;
        const isHidden = layout.classList.contains('notes-hidden');
        if (isHidden) {
          // 隱藏時，按鈕在右側邊緣（CSS 會處理）
          notesToggleBtn.style.right = '';
        } else {
          // 顯示時，根據筆記欄寬度計算位置
          const notesWidth = getComputedStyle(document.documentElement).getPropertyValue('--notes-width') || '350px';
          const gap = getComputedStyle(document.documentElement).getPropertyValue('--space-5') || '20px';
          notesToggleBtn.style.right = `calc(${notesWidth} + ${gap})`;
        }
      }

      // 從 localStorage 讀取保存的狀態
      const isHidden = localStorage.getItem(storageKey) === 'true';
      if (isHidden) {
        layout.classList.add('notes-hidden');
        notesToggleBtn.querySelector('.toggle-icon').textContent = '▶';
      }

      // 初始化按鈕位置
      updateTogglePosition();

      notesToggleBtn.addEventListener('click', () => {
        layout.classList.toggle('notes-hidden');
        const hidden = layout.classList.contains('notes-hidden');
        notesToggleBtn.querySelector('.toggle-icon').textContent = hidden ? '▶' : '◀';
        localStorage.setItem(storageKey, hidden);
        
        // 更新按鈕位置
        setTimeout(updateTogglePosition, 50);
      });

      // 監聽窗口大小變化
      window.addEventListener('resize', updateTogglePosition);
    })();
  </script>
  <!-- 筆記欄拉條功能 -->
  <script>
    (function() {
      const resizer = document.getElementById('notes-resizer');
      const layout = document.querySelector('.b-layout');
      const notesToggle = document.getElementById('notes-toggle');
      const storageKey = 'bct-notes-width';
      
      // 更新按鈕位置的函數（與隱藏功能共享）
      function updateNotesTogglePosition() {
        const notesToggleBtn = document.getElementById('notes-toggle');
        if (!notesToggleBtn) return;
        const isHidden = layout.classList.contains('notes-hidden');
        if (isHidden) {
          notesToggleBtn.style.right = '';
        } else {
          const notesWidth = getComputedStyle(document.documentElement).getPropertyValue('--notes-width') || '350px';
          const gap = getComputedStyle(document.documentElement).getPropertyValue('--space-5') || '20px';
          notesToggleBtn.style.right = `calc(${notesWidth} + ${gap})`;
        }
      }
      
      // 從 localStorage 讀取保存的寬度
      const savedWidth = localStorage.getItem(storageKey);
      if (savedWidth) {
        document.documentElement.style.setProperty('--notes-width', savedWidth + 'px');
      }
      
      // 初始化按鈕位置
      setTimeout(updateNotesTogglePosition, 100);

      if (!resizer) return;

      let isResizing = false;

      resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        resizer.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        
        document.addEventListener('mousemove', handleResize);
        document.addEventListener('mouseup', stopResize);
      });

      function handleResize(e) {
        if (!isResizing) return;
        
        const rect = layout.getBoundingClientRect();
        const notesWidth = rect.right - e.clientX - 20; // 減去 gap
        
        // 限制寬度範圍：最小 200px，最大 800px
        const minWidth = 200;
        const maxWidth = 800;
        const clampedWidth = Math.max(minWidth, Math.min(maxWidth, notesWidth));
        
        // 設置 CSS 變數
        document.documentElement.style.setProperty('--notes-width', clampedWidth + 'px');
        
        // 保存到 localStorage
        localStorage.setItem(storageKey, clampedWidth);
        
        // 更新按鈕位置（使用 requestAnimationFrame 確保平滑）
        requestAnimationFrame(updateNotesTogglePosition);
      }

      function stopResize() {
        isResizing = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        
        document.removeEventListener('mousemove', handleResize);
        document.removeEventListener('mouseup', stopResize);
      }
    })();
  </script>
