
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCT Lesson - Template B</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Design System (新設計系統) -->
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/nav-global.css">
  <link rel="stylesheet" href="styles/templates/lesson-b.css">
</head>
<body class="template-b">
  <div class="container template-b-container">
    <div class="b-layout">
      <!-- 左側：課程列表（可收合） -->
      <aside class="b-sidebar" id="sidebar">
        <div class="b-unit-list" id="sidebar-unit-list"></div>
        <a class="b-review-btn" id="sidebar-review-link" href="#">⚡ 課程複習</a>
      </aside>

      <!-- 側邊欄收合按鈕 -->
      <button class="sidebar-toggle" id="sidebar-toggle" title="收合/展開課程列表">
        <span class="toggle-icon">◀</span>
      </button>

      <!-- 中間：主內容區 -->
      <section class="b-main">
        <header class="b-main-header">
          <nav class="tabs">
            <button class="tab-btn active" data-tab="dialogue">Dialogue</button>
            <button class="tab-btn" data-tab="reading">Reading</button>
            <button class="tab-btn" data-tab="vocabulary">Vocabulary</button>
            <button class="tab-btn" data-tab="components">Components</button>
            <button class="tab-btn" data-tab="vocab" id="vocabTab">Vocab A</button>
            <button class="tab-btn" data-tab="practice">Practice</button>
            <button class="tab-btn" data-tab="grammar">Grammar</button>
          </nav>
        </header>

        <div class="b-content-wrapper">
          <!-- 標題 + 語言切換 -->
          <div class="b-content-header">
            <h1 id="lesson-title" class="b-title">Loading...</h1>
            <div class="toggle-controls">
              <span class="toggle-label">Show:</span>
              <button id="toggle-pinyin" class="toggle-btn toggle-pinyin active" data-lang="pinyin">
                <span class="toggle-check">✓</span> Pinyin
              </button>
              <button id="toggle-en" class="toggle-btn toggle-en active" data-lang="en">
                <span class="toggle-check">✓</span> English
              </button>
              <button id="toggle-es" class="toggle-btn toggle-es active" data-lang="es">
                <span class="toggle-check">✓</span> Español
              </button>
            </div>
          </div>

          <!-- 可滾動內容區 -->
          <div class="b-content-scroll">
            <div class="tab-content">
              <div id="dialogue" class="tab-pane active">
                <div id="dialogue-content" class="content-group"></div>
              </div>
              <div id="reading" class="tab-pane">
                <div id="reading-content" class="content-group"></div>
              </div>
              <div id="vocabulary" class="tab-pane">
                <div id="vocabulary-content" class="content-group"></div>
              </div>
              <div id="components" class="tab-pane">
                <div id="timeline-components-content" class="content-group">
                  <p class="placeholder">暫無內容 Nothing here yet.</p>
                </div>
              </div>
              <div id="vocab" class="tab-pane">
                <div id="timeline-vocab-content" class="content-group">
                  <p class="placeholder">暫無內容 Nothing here yet.</p>
                </div>
              </div>
              <div id="practice" class="tab-pane">
                <div id="practice-content" class="content-group">
                  <p class="placeholder">練習功能開發中... Practice feature coming soon.</p>
                </div>
              </div>
              <div id="grammar" class="tab-pane">
                <div id="grammar-content" class="content-group">
                  <p class="placeholder">文法筆記開發中... Grammar notes coming soon.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 右側：筆記欄 -->
      <aside class="b-notes">
        <div class="b-notes-card">
          <h3>Elisa 的筆記</h3>
          <div class="b-notes-content">
            <div id="teacher-notes"></div>
            <p class="placeholder">暫無筆記 No notes yet.</p>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="assets/js/course-config.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/firestore.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/cohort-selector.js"></script>
  <script src="assets/js/loader.js"></script>
  <script src="assets/js/toggle.js"></script>

  <!-- 側邊欄收合功能 -->
  <script>
    (function() {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('sidebar-toggle');
      const layout = document.querySelector('.b-layout');
      const storageKey = 'bct-sidebar-collapsed';

      // 載入儲存的狀態
      const isCollapsed = localStorage.getItem(storageKey) === 'true';
      if (isCollapsed) {
        layout.classList.add('sidebar-collapsed');
        toggleBtn.querySelector('.toggle-icon').textContent = '▶';
      }

      toggleBtn.addEventListener('click', () => {
        layout.classList.toggle('sidebar-collapsed');
        const collapsed = layout.classList.contains('sidebar-collapsed');
        toggleBtn.querySelector('.toggle-icon').textContent = collapsed ? '▶' : '◀';
        localStorage.setItem(storageKey, collapsed);
      });
    })();
  </script>
</body>
</html>
