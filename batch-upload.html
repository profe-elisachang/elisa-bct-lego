<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批次上傳工具 - BCT Lego</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .lessons-container {
            display: grid;
            gap: 20px;
        }

        .lesson-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .lesson-card.active {
            border-color: #FF8C42;
        }

        .lesson-card.uploaded {
            border-color: #28A745;
            background: #f0fff4;
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .lesson-title-input {
            display: flex;
            gap: 15px;
            align-items: center;
            flex: 1;
        }

        .lesson-title-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
        }

        .lesson-title-input input:focus {
            outline: none;
            border-color: #FF8C42;
        }

        .lesson-number {
            font-size: 24px;
            font-weight: bold;
            color: #FF8C42;
            min-width: 100px;
        }

        .lesson-actions {
            display: flex;
            gap: 10px;
        }

        .content-section {
            margin-bottom: 20px;
        }

        .section-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label .icon {
            font-size: 18px;
        }

        .markdown-input {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        .markdown-input:focus {
            outline: none;
            border-color: #FF8C42;
        }

        .markdown-input.has-content {
            border-color: #28A745;
            background: #f9fff9;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #FF8C42;
            color: white;
        }

        .btn-primary:hover {
            background: #E67A31;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28A745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #DC3545;
            color: white;
        }

        .btn-danger:hover {
            background: #C82333;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .preview-section.show {
            display: block;
        }

        .preview-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }

        .stat-item {
            padding: 8px 15px;
            background: white;
            border-radius: 6px;
            font-size: 14px;
        }

        .stat-item .number {
            font-weight: bold;
            color: #FF8C42;
            font-size: 18px;
        }

        .global-actions {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-lesson-btn {
            background: #17A2B8;
            color: white;
            font-size: 16px;
            padding: 12px 24px;
        }

        .add-lesson-btn:hover {
            background: #138496;
        }

        .batch-actions {
            display: flex;
            gap: 10px;
        }

        .log-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .log-content {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .success { color: #28A745; }
        .error { color: #DC3545; }
        .warning { color: #FFC107; }
        .info { color: #17A2B8; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 BCT 批次上傳工具</h1>
            <p class="subtitle">直接貼上 Markdown 內容，一鍵上傳到 Firestore</p>
        </header>

        <div class="global-actions">
            <div style="display: flex; align-items: center; gap: 15px;">
                <label style="font-weight: bold;">選擇課程：</label>
                <select id="course-select" onchange="changeCourse()" style="padding: 12px 20px; border: 2px solid #FF8C42; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
                    <option value="btc1">BTC1 - 初级</option>
                    <option value="btc2">BTC2 - 中级</option>
                    <option value="btc3">BTC3 - 高级</option>
                </select>
                <input id="lesson-number-input" type="number" min="1" placeholder="課次"
                       style="width: 90px; padding: 10px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px;">
                <button class="add-lesson-btn" onclick="addLessonWithNumber()">
                    ➕ 新增/切換課次
                </button>
                <button class="add-lesson-btn" onclick="addLesson()">
                    ➕ 新增課程
                </button>
            </div>
            <div class="batch-actions">
                <button class="btn-success" onclick="batchUpload()">
                    🚀 批次上傳全部
                </button>
                <button class="btn-secondary" onclick="saveToLocalStorage()">
                    💾 儲存草稿
                </button>
                <button class="btn-danger" onclick="clearAll()">
                    🗑️ 清空全部
                </button>
            </div>
        </div>

        <div id="lessons-container" class="lessons-container">
            <!-- 動態生成課程卡片 -->
        </div>

        <div class="log-container">
            <h3>📋 上傳日誌</h3>
            <div id="log-content" class="log-content">
等待開始上傳...
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="assets/js/firestore.js?v=debug-8"></script>

    <script>
        // 全域變數
        let currentCourse = 'btc1';
        let coursesData = {
            btc1: { lessons: [], nextLessonNumber: 2 },
            btc2: { lessons: [], nextLessonNumber: 1 },
            btc3: { lessons: [], nextLessonNumber: 1 }
        };

        // 兼容舊版（指向當前課程）
        let lessons = [];
        let nextLessonNumber = 2;

        // 簡易老師自動登入
        async function ensureSignedIn() {
            // 確保 Firebase 已初始化
            if (!firestoreService.isConnected()) {
                await firestoreService.init();
            }
            if (!firestoreService.isConnected()) {
                log('❌ Firestore 未連線，無法登入', 'error');
                return;
            }
            if (firebase.auth().currentUser) return;
            try {
                await firebase.auth().signInWithEmailAndPassword('elisachangn@gmail.com', 'wo3ai4PAco');
                log('✅ 老師帳號登入成功', 'success');
            } catch (err) {
                console.error('signin failed', err);
                log(`❌ 登入失敗：${err.message || err}`, 'error');
                alert('登入失敗，請確認帳號密碼或稍後再試');
            }
        }

        // 初始化
        async function init() {
            log('🚀 初始化批次上傳工具...', 'info');

            // 先初始化 Firestore
            if (!firestoreService.isConnected()) {
                await firestoreService.init();
            }

            // 確保已登入（防止未登入寫入）
            await ensureSignedIn();

            if (!firestoreService.isConnected()) {
                log('❌ Firestore 未初始化成功，請稍後重試', 'error');
                alert('Firestore 連線失敗，請檢查網路或重新整理');
                return;
            }

            // 從 localStorage 載入草稿
            loadFromLocalStorage();

            // 同步當前課程數據
            syncCurrentCourse();

            // 如果沒有課程，加入第一個
            if (lessons.length === 0) {
                addLesson();
            }

            renderLessons();
        }

        // 切換課程
        function changeCourse() {
            // 先保存當前課程數據
            coursesData[currentCourse].lessons = lessons;
            coursesData[currentCourse].nextLessonNumber = nextLessonNumber;

            // 切換到新課程
            currentCourse = document.getElementById('course-select').value;
            syncCurrentCourse();

            log(`📚 切換到 ${currentCourse.toUpperCase()}`, 'info');
            renderLessons();
            autoSave();
        }

        // 同步當前課程數據到全域變數
        function syncCurrentCourse() {
            lessons = coursesData[currentCourse].lessons;
            nextLessonNumber = coursesData[currentCourse].nextLessonNumber;
        }

        // 新增課程
        function addLesson() {
            const lessonId = `${currentCourse}_lesson${nextLessonNumber}`;
            lessons.push({
                id: lessonId,
                course: currentCourse,
                number: nextLessonNumber,
                title: '',
                order: nextLessonNumber,
                vocabularyMd: '',
                dialogueMd: '',
                readingMd: '',
                uploaded: false
            });
            nextLessonNumber++;
            coursesData[currentCourse].nextLessonNumber = nextLessonNumber;
            renderLessons();
            autoSave();
        }

        function addLessonWithNumber() {
            const input = document.getElementById('lesson-number-input');
            const num = parseInt(input.value, 10);
            if (!num || num < 1) {
                alert('請輸入有效的課次');
                return;
            }

            const existsIndex = lessons.findIndex(l => l.number === num);
            if (existsIndex !== -1) {
                const target = document.getElementById(`lesson-${lessons[existsIndex].id}`);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                return;
            }

            const lessonId = `${currentCourse}_lesson${num}`;
            lessons.push({
                id: lessonId,
                course: currentCourse,
                number: num,
                title: '',
                order: num,
                vocabularyMd: '',
                dialogueMd: '',
                readingMd: '',
                uploaded: false
            });

            if (num >= nextLessonNumber) {
                nextLessonNumber = num + 1;
                coursesData[currentCourse].nextLessonNumber = nextLessonNumber;
            }

            renderLessons();
            autoSave();

            const target = document.getElementById(`lesson-${lessonId}`);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 渲染課程列表
        function renderLessons() {
            const container = document.getElementById('lessons-container');

            if (lessons.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <h2>尚無課程</h2>
                        <p>點擊「新增課程」開始上傳資料</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = lessons.map((lesson, index) => `
                <div class="lesson-card ${lesson.uploaded ? 'uploaded' : ''}" id="lesson-${lesson.id}">
                    <div class="lesson-header">
                        <div class="lesson-number">${currentCourse.toUpperCase()} - Lesson ${lesson.number}</div>
                        <div class="lesson-title-input">
                            <label>標題：</label>
                            <input type="text"
                                   value="${lesson.title}"
                                   onchange="updateLessonTitle(${index}, this.value)"
                                   placeholder="輸入標題">
                            <label>Order：</label>
                            <input type="number"
                                   value="${lesson.order}"
                                   onchange="updateLessonOrder(${index}, this.value)"
                                   style="width: 80px;">
                        </div>
                        <div class="lesson-actions">
                            <button class="btn-secondary" onclick="previewLesson(${index})">👁️ 預覽</button>
                            <button class="btn-primary" onclick="uploadLesson(${index})">
                                ${lesson.uploaded ? '♻️ 覆蓋上傳' : '📤 上傳'}
                            </button>
                            <button class="btn-danger" onclick="removeLesson(${index})">🗑️</button>
                        </div>
                    </div>

                    <div class="content-section">
                        <div class="section-label">
                            <span class="icon">📖</span>
                            Vocabulary Markdown
                        </div>
                        <textarea class="markdown-input ${lesson.vocabularyMd ? 'has-content' : ''}"
                                  onchange="updateMarkdown(${index}, 'vocabularyMd', this.value)"
                                  placeholder="## 1&#10;hsk: 1&#10;pinyin: nǐ&#10;character: 你&#10;english: you&#10;spanish: tú">${lesson.vocabularyMd}</textarea>
                    </div>

                    <div class="content-section">
                        <div class="section-label">
                            <span class="icon">💬</span>
                            Dialogue Markdown（5 組對話）
                        </div>
                        <textarea class="markdown-input ${lesson.dialogueMd ? 'has-content' : ''}"
                                  onchange="updateMarkdown(${index}, 'dialogueMd', this.value)"
                                  placeholder="## group-1&#10;### sentence-1&#10;pinyin: Nǐ hǎo!&#10;character: 你好！&#10;english: Hello!&#10;spanish: ¡Hola!&#10;&#10;### sentence-2&#10;pinyin: Nǐ hǎo!&#10;...&#10;&#10;## group-2&#10;...">${lesson.dialogueMd}</textarea>
                    </div>

                    <div class="content-section">
                        <div class="section-label">
                            <span class="icon">📄</span>
                            Reading Markdown
                        </div>
                        <textarea class="markdown-input ${lesson.readingMd ? 'has-content' : ''}"
                                  onchange="updateMarkdown(${index}, 'readingMd', this.value)"
                                  placeholder="## 1&#10;pinyin: ...&#10;character: ...&#10;english: ...&#10;spanish: ...">${lesson.readingMd}</textarea>
                    </div>

                    <div class="preview-section" id="preview-${lesson.id}">
                        <h4>預覽結果</h4>
                        <div class="preview-stats" id="stats-${lesson.id}"></div>
                        <div id="preview-content-${lesson.id}"></div>
                    </div>
                </div>
            `).join('');
        }

        // 更新課程資料
        function updateLessonTitle(index, value) {
            lessons[index].title = value;
            lessons[index].uploaded = false;
            autoSave();
        }

        function updateLessonOrder(index, value) {
            lessons[index].order = parseInt(value);
            lessons[index].uploaded = false;
            autoSave();
        }

        function updateMarkdown(index, field, value) {
            lessons[index][field] = value;
            lessons[index].uploaded = false;
            autoSave();
        }

        // 移除課程
        function removeLesson(index) {
            if (confirm('確定要刪除這個課程嗎？')) {
                lessons.splice(index, 1);
                renderLessons();
                autoSave();
            }
        }

        // 預覽課程
        function previewLesson(index) {
            const lesson = lessons[index];
            const previewSection = document.getElementById(`preview-${lesson.id}`);
            const statsDiv = document.getElementById(`stats-${lesson.id}`);

            // 解析 Markdown
            const vocabulary = parseVocabularyMarkdown(lesson.vocabularyMd);
            const dialogue = parseDialogueMarkdown(lesson.dialogueMd);
            const reading = parseReadingMarkdown(lesson.readingMd);

            // 顯示統計
            statsDiv.innerHTML = `
                <div class="stat-item">
                    <div class="number">${vocabulary.length}</div>
                    <div>個單字</div>
                </div>
                <div class="stat-item">
                    <div class="number">${dialogue.length}</div>
                    <div>句對話</div>
                </div>
                <div class="stat-item">
                    <div class="number">${reading.length}</div>
                    <div>個閱讀項目</div>
                </div>
            `;

            previewSection.classList.toggle('show');
            log(`📊 預覽 ${lesson.id}: ${vocabulary.length} 單字, ${dialogue.length} 對話, ${reading.length} 閱讀`, 'info');
        }

        // 上傳單一課程
        async function uploadLesson(index) {
            const lesson = lessons[index];
            log(`📤 開始上傳 ${lesson.id}...`, 'info');

            // #region agent log
            fetch('http://127.0.0.1:7243/ingest/fe98b67c-7883-463c-8159-8386c334ac76',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    sessionId:'debug-session',
                    runId:'baseline',
                    hypothesisId:'H2',
                    location:'batch-upload.html:uploadLesson',
                    message:'Upload start',
                    data:{lessonId:lesson.id, title:lesson.title, isConnected:firestoreService.isConnected()},
                    timestamp:Date.now()
                })
            }).catch(()=>{});
            // #endregion

            try {
                // 解析 Markdown
                const vocabulary = parseVocabularyMarkdown(lesson.vocabularyMd);
                const dialogue = parseDialogueMarkdown(lesson.dialogueMd);
                const reading = parseReadingMarkdown(lesson.readingMd);

                const clearSubcollection = async (ref, name) => {
                    const snap = await ref.collection(name).get();
                    if (snap.empty) return 0;
                    await Promise.all(snap.docs.map(doc => doc.ref.delete()));
                    return snap.size;
                };

                // 創建 lesson 文件（路徑：courses/{course}/lessons/{lessonN}）
                const firestoreLessonId = `lesson${lesson.number}`;
                const lessonRef = firestoreService.db
                    .collection('courses')
                    .doc(lesson.course || currentCourse)
                    .collection('lessons')
                    .doc(firestoreLessonId);
                await lessonRef.set({
                    title: lesson.title,
                    scope: 'lesson',
                    course: lesson.course || currentCourse,
                    date: new Date().toISOString().split('T')[0],
                    order: lesson.order
                });
                log(`✅ 創建 ${lesson.course || currentCourse}/${firestoreLessonId} 文件`, 'success');
                // #region agent log
                fetch('http://127.0.0.1:7243/ingest/fe98b67c-7883-463c-8159-8386c334ac76',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        sessionId:'debug-session',
                        runId:'baseline',
                        hypothesisId:'H2',
                        location:'batch-upload.html:uploadLesson',
                        message:'Lesson doc created',
                        data:{lessonId:lesson.id, vocabCount:vocabulary.length, dialogueCount:dialogue.length, readingCount:reading.length},
                        timestamp:Date.now()
                    })
                }).catch(()=>{});
                // #endregion

                // 清除舊子集合（覆蓋模式）
                log('🧹 清空舊資料...', 'info');
                const [clearedVocab, clearedDialogue, clearedReading] = await Promise.all([
                    clearSubcollection(lessonRef, 'vocabulary'),
                    clearSubcollection(lessonRef, 'dialogue'),
                    clearSubcollection(lessonRef, 'reading')
                ]);
                log(`✅ 已清空：單字 ${clearedVocab}、對話 ${clearedDialogue}、閱讀 ${clearedReading}`, 'success');
                // #region agent log
                fetch('http://127.0.0.1:7243/ingest/fe98b67c-7883-463c-8159-8386c334ac76',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        sessionId:'debug-session',
                        runId:'baseline',
                        hypothesisId:'H16',
                        location:'batch-upload.html:uploadLesson',
                        message:'Cleared subcollections',
                        data:{lessonId:lesson.id, clearedVocab, clearedDialogue, clearedReading},
                        timestamp:Date.now()
                    })
                }).catch(()=>{});
                // #endregion

                // 上傳 Vocabulary
                if (vocabulary.length > 0) {
                    for (let i = 0; i < vocabulary.length; i++) {
                        const docId = `vocab_${String(i + 1).padStart(3, '0')}`;
                        await lessonRef.collection('vocabulary').doc(docId).set(vocabulary[i]);
                    }
                    log(`✅ 上傳 ${vocabulary.length} 個單字`, 'success');
                }

                // 上傳 Dialogue
                if (dialogue.length > 0) {
                    for (let i = 0; i < dialogue.length; i++) {
                        const docId = `sentence_${String(i + 1).padStart(3, '0')}`;
                        await lessonRef.collection('dialogue').doc(docId).set(dialogue[i]);
                    }
                    log(`✅ 上傳 ${dialogue.length} 句對話`, 'success');
                }

                // 上傳 Reading
                if (reading.length > 0) {
                    for (let i = 0; i < reading.length; i++) {
                        const docId = `reading_${String(i + 1).padStart(3, '0')}`;
                        await lessonRef.collection('reading').doc(docId).set(reading[i]);
                    }
                    log(`✅ 上傳 ${reading.length} 個閱讀項目`, 'success');
                }

                lessons[index].uploaded = true;
                renderLessons();
                log(`🎉 ${lesson.id} 上傳完成！`, 'success');

            } catch (error) {
                log(`❌ 上傳失敗: ${error.message}`, 'error');
            }
        }

        // 批次上傳
        async function batchUpload() {
            const unuploadedLessons = lessons.filter(l => !l.uploaded);

            if (unuploadedLessons.length === 0) {
                alert('所有課程都已上傳！');
                return;
            }

            if (!confirm(`確定要上傳 ${unuploadedLessons.length} 個課程嗎？`)) {
                return;
            }

            log(`🚀 開始批次上傳 ${unuploadedLessons.length} 個課程...`, 'info');

            for (let i = 0; i < lessons.length; i++) {
                if (!lessons[i].uploaded) {
                    await uploadLesson(i);
                }
            }

            log(`🎊 批次上傳完成！`, 'success');
        }

        // Parser 函數（重用之前的邏輯）
        function parseVocabularyMarkdown(markdown) {
            if (!markdown.trim()) return [];

            const vocabulary = [];
            let currentItem = {};
            let order = 1;

            markdown.split('\n').forEach(line => {
                const trimmed = line.trim();

                if (trimmed.startsWith('## ')) {
                    if (currentItem.pinyin) {
                        currentItem.order = order++;
                        currentItem.type = 'vocab';
                        currentItem.review = true;
                        vocabulary.push({...currentItem});
                    }
                    currentItem = {};
                } else if (trimmed.includes(':')) {
                    const [key, ...rest] = trimmed.split(':');
                    const value = rest.join(':').trim();
                    if (key && value) {
                        currentItem[key.trim()] = key.trim() === 'hsk' ? parseInt(value) : value;
                    }
                }
            });

            if (currentItem.pinyin) {
                currentItem.order = order++;
                currentItem.type = 'vocab';
                currentItem.review = true;
                vocabulary.push({...currentItem});
            }

            return vocabulary;
        }

        function parseDialogueMarkdown(markdown) {
            if (!markdown.trim()) return [];

            const dialogue = [];
            let currentGroup = null;
            let currentSentence = {};
            let order = 1;

            markdown.split('\n').forEach(line => {
                const trimmed = line.trim();

                if (trimmed.startsWith('## ')) {
                    // 保存上一句
                    if (currentSentence.pinyin && currentGroup) {
                        currentSentence.order = order++;
                        currentSentence.type = 'sentence';
                        currentSentence.review = false;
                        currentSentence.group = currentGroup;
                        dialogue.push({...currentSentence});
                    }
                    // 開始新的 group
                    currentGroup = trimmed.slice(3).trim(); // group-1, group-2...
                    currentSentence = {};
                } else if (trimmed.startsWith('###')) {
                    // 保存上一句
                    if (currentSentence.pinyin && currentGroup) {
                        currentSentence.order = order++;
                        currentSentence.type = 'sentence';
                        currentSentence.review = false;
                        currentSentence.group = currentGroup;
                        dialogue.push({...currentSentence});
                    }
                    currentSentence = {};
                } else if (trimmed.includes(':')) {
                    const [key, ...rest] = trimmed.split(':');
                    const value = rest.join(':').trim();
                    if (key && value) {
                        currentSentence[key.trim()] = value;
                    }
                }
            });

            // 保存最後一句
            if (currentSentence.pinyin && currentGroup) {
                currentSentence.order = order++;
                currentSentence.type = 'sentence';
                currentSentence.review = false;
                currentSentence.group = currentGroup;
                dialogue.push({...currentSentence});
            }

            return dialogue;
        }

        function parseReadingMarkdown(markdown) {
            if (!markdown.trim()) return [];

            const reading = [];
            let currentItem = {};
            let order = 1;

            markdown.split('\n').forEach(line => {
                const trimmed = line.trim();

                if (trimmed.startsWith('##')) {
                    if (currentItem.pinyin) {
                        currentItem.order = order++;
                        currentItem.type = 'reading';
                        currentItem.review = false;
                        reading.push({...currentItem});
                    }
                    currentItem = {};
                } else if (trimmed.includes(':')) {
                    const [key, ...rest] = trimmed.split(':');
                    const value = rest.join(':').trim();
                    if (key && value) {
                        currentItem[key.trim()] = value;
                    }
                }
            });

            if (currentItem.pinyin) {
                currentItem.order = order++;
                currentItem.type = 'reading';
                currentItem.review = false;
                reading.push({...currentItem});
            }

            return reading;
        }

        // LocalStorage 管理
        function saveToLocalStorage() {
            // 先同步當前課程數據
            coursesData[currentCourse].lessons = lessons;
            coursesData[currentCourse].nextLessonNumber = nextLessonNumber;

            localStorage.setItem('bct-batch-upload-v2', JSON.stringify({
                currentCourse,
                coursesData
            }));
            log('💾 草稿已儲存到瀏覽器', 'success');
            alert('草稿已儲存！');
        }

        function loadFromLocalStorage() {
            // 嘗試讀取新版格式
            const savedV2 = localStorage.getItem('bct-batch-upload-v2');
            if (savedV2) {
                const data = JSON.parse(savedV2);
                currentCourse = data.currentCourse || 'btc1';
                coursesData = data.coursesData || {
                    btc1: { lessons: [], nextLessonNumber: 2 },
                    btc2: { lessons: [], nextLessonNumber: 1 },
                    btc3: { lessons: [], nextLessonNumber: 1 }
                };
                document.getElementById('course-select').value = currentCourse;
                log('📂 已載入草稿', 'info');
                return;
            }

            // 兼容舊版格式
            const saved = localStorage.getItem('bct-batch-upload');
            if (saved) {
                const data = JSON.parse(saved);
                coursesData.btc1.lessons = data.lessons || [];
                coursesData.btc1.nextLessonNumber = data.nextLessonNumber || 2;
                log('📂 已載入舊版草稿（已遷移到 BTC1）', 'info');
            }
        }

        function autoSave() {
            coursesData[currentCourse].lessons = lessons;
            coursesData[currentCourse].nextLessonNumber = nextLessonNumber;

            localStorage.setItem('bct-batch-upload-v2', JSON.stringify({
                currentCourse,
                coursesData
            }));
        }

        function clearAll() {
            if (confirm('確定要清空所有課程嗎？此操作無法復原！')) {
                lessons = [];
                nextLessonNumber = 2;
                localStorage.removeItem('bct-batch-upload');
                renderLessons();
                log('🗑️ 已清空所有課程', 'warning');
            }
        }

        // 日誌
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log-content');
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // 頁面載入時初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
