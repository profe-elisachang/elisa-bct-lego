<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio - Component Management</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Design System -->
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Lesson Template B Styles -->
  <link rel="stylesheet" href="styles/templates/lesson-b.css">
  <style>
    /* Studio 專屬樣式 */
    .studio-container {
      max-width: 100%;
      margin: 0;
      padding: var(--space-4);
      height: calc(100vh );
      display: flex;
      flex-direction: column;
    }

    .studio-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--gray-200);
    }

    .studio-header h1 {
      margin: 0;
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--gray-900);
    }

    .level-selector {
      display: flex;
      gap: var(--space-2);
      align-items: center;
    }

    .level-selector label {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--gray-600);
    }

    .level-selector select {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-lg);
      font-size: var(--text-sm);
      background: var(--bg-card);
      color: var(--gray-900);
    }

    .studio-layout {
      display: grid;
      grid-template-columns: var(--studio-sidebar-width, 40%) 4px 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* 最小化側邊欄（而不是完全隱藏） */
    .studio-layout.sidebar-hidden {
      grid-template-columns: 60px 4px 1fr;
    }

    .studio-layout.sidebar-hidden .studio-editor {
      width: 60px;
      overflow: hidden;
    }

    .studio-layout.sidebar-hidden .editor-header {
      padding: var(--space-2);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      justify-content: center;
    }

    .studio-layout.sidebar-hidden .editor-header h2 {
      font-size: var(--text-xs);
      transform: rotate(180deg);
    }

    .studio-layout.sidebar-hidden .editor-header .btn-icon,
    .studio-layout.sidebar-hidden .editor-content {
      display: none;
    }

    .studio-layout.sidebar-hidden .resizer {
      display: block;
    }

    /* 編輯面板 */
    .studio-editor {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4);
      border-bottom: 1px solid var(--gray-200);
      background: var(--gray-50);
    }

    .editor-header h2 {
      margin: 0;
      font-size: var(--text-lg);
      font-weight: var(--font-bold);
      color: var(--gray-900);
    }

    .sidebar-toggle-btn {
      padding: var(--space-2);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--gray-600);
      font-size: var(--text-lg);
      border-radius: var(--radius-md);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .sidebar-toggle-btn:hover {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    /* 確保按鈕始終可見 */
    #sidebar-toggle {
      display: inline-block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .editor-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-4);
    }

    .form-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .form-item {
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      border: 2px solid var(--gray-200);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .form-item:hover {
      border-color: var(--primary-border);
    }

    .form-item.active {
      border-color: var(--primary);
      background: var(--primary-bg);
    }

    .form-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-3);
    }

    .form-item-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--gray-600);
    }

    .form-item-actions {
      display: flex;
      gap: var(--space-2);
    }

    .btn-icon {
      padding: var(--space-1) var(--space-2);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--gray-500);
      font-size: var(--text-sm);
      border-radius: var(--radius-md);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .btn-icon:hover {
      background: var(--gray-200);
      color: var(--gray-900);
    }

    .btn-icon.delete:hover {
      background: var(--danger);
      color: white;
    }

    .form-group {
      margin-bottom: var(--space-3);
    }

    .form-group label {
      display: block;
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      color: var(--gray-600);
      margin-bottom: var(--space-1);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-family: inherit;
      background: var(--bg-card);
      color: var(--gray-900);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-bg);
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-group textarea.markdown-content {
      min-height: 150px;
      font-family: 'Courier New', monospace;
    }

    /* 移除 Markdown 多餘的色彩配置，使用簡化樣式 */
    .timeline-notes.markdown-body,
    .timeline-notes {
      color: inherit;
    }

    .timeline-notes.markdown-body h3,
    .timeline-notes h3 {
      color: inherit;
      border-bottom: none;
      font-weight: 700;
      font-size: 1.3em;
      margin: 18px 0 10px 0;
      padding-bottom: 0;
    }

    .timeline-notes.markdown-body h4,
    .timeline-notes h4 {
      color: inherit;
      font-weight: 600;
      font-size: 1.15em;
      margin: 15px 0 10px 0;
    }

    .timeline-notes.markdown-body strong,
    .timeline-notes.markdown-body b,
    .timeline-notes strong,
    .timeline-notes b {
      color: inherit;
      font-weight: 700;
    }

    .timeline-notes.markdown-body code,
    .timeline-notes code {
      background: var(--gray-100);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
    }

    /* 預覽面板 */
    .studio-preview {
      display: flex !important;
      flex-direction: column;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      min-width: 0;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4);
      border-bottom: 1px solid var(--gray-200);
      background: var(--gray-50);
    }

    .preview-header h2 {
      margin: 0;
      font-size: var(--text-lg);
      font-weight: var(--font-bold);
      color: var(--gray-900);
    }

    .preview-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-5) var(--space-6);
    }

    .preview-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    /* 教學模態框 */
    .teaching-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .teaching-modal.active {
      display: flex;
    }

    .teaching-modal-content {
      width: 60%;
      max-height: 90vh;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-2xl);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .teaching-modal-header {
      padding: var(--space-4);
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--gray-50);
    }

    .teaching-modal-header h3 {
      margin: 0;
      font-size: var(--text-xl);
      font-weight: var(--font-bold);
      color: var(--gray-900);
    }

    .teaching-modal-close {
      padding: var(--space-2);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--gray-600);
      font-size: var(--text-xl);
      border-radius: var(--radius-md);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .teaching-modal-close:hover {
      background: var(--gray-200);
      color: var(--gray-900);
    }

    .teaching-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-6);
    }

    /* 拖拽手柄 */
    .drag-handle {
      cursor: move;
      color: var(--gray-400);
      font-size: var(--text-lg);
      padding: var(--space-1);
    }

    .drag-handle:hover {
      color: var(--gray-600);
    }

    .form-item.dragging {
      opacity: 0.5;
    }

    .timeline-card.dragging {
      opacity: 0.5;
    }

    /* 折疊/展開按鈕 */
    .collapse-toggle {
      padding: var(--space-1) var(--space-2);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--gray-500);
      font-size: var(--text-sm);
      border-radius: var(--radius-md);
      transition: all var(--duration-fast) var(--ease-out);
      min-width: 24px;
    }

    .collapse-toggle:hover {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    /* 表單項目折疊狀態 */
    .form-item.collapsed .form-item-body {
      display: none;
    }

    .form-item.collapsed .form-item-header {
      margin-bottom: 0;
    }

    /* 確保「字」欄位始終可見（即使在折疊狀態） */
    .character-group {
      display: block !important;
    }

    /* 全部折疊/展開按鈕 */
    #collapse-all-btn,
    #expand-all-btn {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--gray-300);
      background: var(--bg-card);
      color: var(--gray-700);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }

    #collapse-all-btn:hover,
    #expand-all-btn:hover {
      background: var(--gray-100);
      border-color: var(--gray-400);
      color: var(--gray-900);
    }

    /* 可調整寬度的拉條 */
    .resizer {
      width: 4px;
      background: var(--gray-200);
      cursor: col-resize;
      position: relative;
      transition: background var(--duration-fast) var(--ease-out);
      z-index: 10;
    }

    .resizer:hover {
      background: var(--primary);
    }

    .resizer::before {
      content: '';
      position: absolute;
      left: -2px;
      top: 0;
      bottom: 0;
      width: 8px;
      cursor: col-resize;
    }

    .resizer.dragging {
      background: var(--primary);
    }
  </style>
</head>
<body>
  <div class="studio-container">
    <div class="studio-header">
      <h1>Studio - 部件與目標字管理 2.0</h1>
      <div style="display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap;">
        <div class="level-selector">
          <label for="level-select">等級:</label>
          <select id="level-select">
            <option value="btc1">BCT 1</option>
            <option value="btc2">BCT 2</option>
            <option value="btc3">BCT 3</option>
          </select>
        </div>
        <div class="level-selector">
          <label for="type-select">類型:</label>
          <select id="type-select">
            <option value="component">部件</option>
            <option value="target-character">目標字</option>
          </select>
        </div>
        <div class="level-selector">
          <label for="lesson-select">課次:</label>
          <select id="lesson-select">
            <option value="">全部課次</option>
            <option value="lesson1">Lesson 1</option>
            <option value="lesson2">Lesson 2</option>
            <option value="lesson3">Lesson 3</option>
            <option value="lesson4">Lesson 4</option>
            <option value="lesson5">Lesson 5</option>
            <option value="lesson6">Lesson 6</option>
            <option value="lesson7">Lesson 7</option>
            <option value="lesson8">Lesson 8</option>
            <option value="lesson9">Lesson 9</option>
            <option value="lesson10">Lesson 10</option>
            <option value="lesson11">Lesson 11</option>
            <option value="lesson12">Lesson 12</option>
            <option value="lesson13">Lesson 13</option>
            <option value="lesson14">Lesson 14</option>
            <option value="lesson15">Lesson 15</option>
            <option value="lesson16">Lesson 16</option>
            <option value="lesson17">Lesson 17</option>
            <option value="lesson18">Lesson 18</option>
            <option value="lesson19">Lesson 19</option>
            <option value="lesson20">Lesson 20</option>
          </select>
        </div>
      </div>
    </div>

    <div class="studio-layout" id="studio-layout">
      <!-- 左側：編輯面板 -->
      <div class="studio-editor" id="studio-editor">
        <div class="editor-header">
          <div style="display: flex; align-items: center; gap: var(--space-2);">
            <h2>編輯表單</h2>
            <button class="btn-icon" id="collapse-all-btn" title="全部折疊">全部折疊</button>
            <button class="btn-icon" id="expand-all-btn" title="全部展開">全部展開</button>
          </div>
          <button class="btn-icon" id="add-component-btn" title="添加新項目" style="background: var(--primary); color: white; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-semibold);">
            + 新增
          </button>
        </div>
        <div class="editor-content">
          <div class="form-list" id="form-list">
            <!-- 表單項目將由 JavaScript 動態生成 -->
          </div>
        </div>
      </div>

      <!-- 可調整寬度的拉條 -->
      <div class="resizer" id="studio-resizer"></div>

      <!-- 右側：預覽面板 -->
      <div class="studio-preview">
        <div class="preview-header">
          <h2>實時預覽</h2>
          <div style="display: flex; gap: var(--space-2); align-items: center;">
            <button class="sidebar-toggle-btn" id="sidebar-toggle" title="顯示/隱藏編輯面板" style="display: inline-block !important; visibility: visible !important; opacity: 1 !important;">◀</button>
          </div>
        </div>
        <div class="preview-content">
          <div class="preview-list" id="preview-list">
            <!-- 預覽卡片將由 JavaScript 動態生成 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 教學模態框 -->
  <div class="teaching-modal" id="teaching-modal">
    <div class="teaching-modal-content">
      <div class="teaching-modal-header">
        <h3>教學視圖</h3>
        <button class="teaching-modal-close" id="modal-close">×</button>
      </div>
      <div class="teaching-modal-body" id="modal-body">
        <!-- 模態框內容將由 JavaScript 動態生成 -->
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <!-- Cloudinary Upload Widget -->
  <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

  <!-- 應用腳本 -->
  <script src="assets/js/firestore.js"></script>
  <script src="assets/js/markdown-renderer.js"></script>
  <script src="studio.js"></script>
</body>
</html>
