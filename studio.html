<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio - Component Management</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Design System -->
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Lesson Template B Styles -->
  <link rel="stylesheet" href="styles/templates/lesson-b.css">
  <style>
    /* Studio 專屬樣式 */
    .studio-container {
      max-width: 100%;
      margin: 0;
      padding: var(--space-4);
      height: calc(100vh );
      display: flex;
      flex-direction: column;
    }

    /* 標題已移除 */

    /* 合併導航欄（等級/課次 + 模式切換） */
    .studio-navbar {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-4);
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--gray-200);
      flex-wrap: wrap;
    }

    .navbar-selectors {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .navbar-divider {
      width: 1px;
      height: 24px;
      background: var(--gray-300);
      margin: 0 var(--space-2);
    }

    .navbar-modes {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: 1;
      flex-wrap: wrap;
    }

    .level-selector {
      display: flex;
      gap: var(--space-2);
      align-items: center;
    }

    .level-selector label {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--gray-600);
    }

    .level-selector select {
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      background: var(--bg-card);
      color: var(--gray-900);
      min-width: 80px;
    }

    .studio-layout {
      display: grid;
      grid-template-columns: var(--studio-sidebar-width, 40%) 4px 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* 最小化側邊欄（而不是完全隱藏） */
    .studio-layout.sidebar-hidden {
      grid-template-columns: 60px 4px 1fr;
    }

    .studio-layout.sidebar-hidden .studio-editor {
      width: 60px;
      overflow: hidden;
    }

    .studio-layout.sidebar-hidden .editor-header {
      padding: var(--space-2);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      justify-content: center;
    }

    .studio-layout.sidebar-hidden .editor-header h2 {
      font-size: var(--text-xs);
      transform: rotate(180deg);
    }

    .studio-layout.sidebar-hidden .editor-header .btn-icon,
    .studio-layout.sidebar-hidden .editor-content {
      display: none;
    }

    .studio-layout.sidebar-hidden .resizer {
      display: block;
    }

    /* 編輯面板 */
    .studio-editor {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4);
      border-bottom: 1px solid var(--gray-200);
      background: var(--gray-50);
    }

    .editor-header h2 {
      margin: 0;
      font-size: var(--text-lg);
      font-weight: var(--font-bold);
      color: var(--gray-900);
    }

    .sidebar-toggle-btn {
      padding: var(--space-2);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--gray-600);
      font-size: var(--text-lg);
      border-radius: var(--radius-md);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .sidebar-toggle-btn:hover {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    /* 確保按鈕始終可見 */
    #sidebar-toggle {
      display: inline-block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .editor-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-4);
    }

    .form-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .form-item {
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      border: 2px solid var(--gray-200);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .form-item:hover {
      border-color: var(--primary-border);
    }

    .form-item.active {
      border-color: var(--primary);
      background: var(--primary-bg);
    }

    /* 選中卡片的視覺提示 */
    .form-item.selected {
      border-color: var(--primary);
      background: var(--primary-bg);
      box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.3);
      position: relative;
    }

    .form-item.selected::before {
      content: '👁️ 正在預覽';
      position: absolute;
      top: -8px;
      right: 12px;
      background: var(--primary);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      z-index: 10;
      white-space: nowrap;
    }

    .form-item.selected .form-item-title {
      color: var(--primary);
      font-weight: 700;
    }

    .form-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-3);
      gap: var(--space-2);
    }

    .form-item-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--gray-600);
    }

    .form-item-actions {
      display: flex;
      gap: var(--space-2);
    }

    .btn-icon {
      padding: var(--space-1) var(--space-2);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--gray-500);
      font-size: var(--text-sm);
      border-radius: var(--radius-md);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .btn-icon:hover {
      background: var(--gray-200);
      color: var(--gray-900);
    }

    .btn-icon.delete:hover {
      background: var(--danger);
      color: white;
    }

    .form-group {
      margin-bottom: var(--space-3);
    }

    .form-group label {
      display: block;
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      color: var(--gray-600);
      margin-bottom: var(--space-1);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-family: inherit;
      background: var(--bg-card);
      color: var(--gray-900);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-bg);
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-group textarea.markdown-content {
      min-height: 150px;
      font-family: 'Courier New', monospace;
    }

    /* 移除 Markdown 多餘的色彩配置，使用簡化樣式 */
    .timeline-notes.markdown-body,
    .timeline-notes {
      color: inherit;
    }

    .timeline-notes.markdown-body h3,
    .timeline-notes h3 {
      color: inherit;
      border-bottom: none;
      font-weight: 700;
      font-size: 1.3em;
      margin: 18px 0 10px 0;
      padding-bottom: 0;
    }

    .timeline-notes.markdown-body h4,
    .timeline-notes h4 {
      color: inherit;
      font-weight: 600;
      font-size: 1.15em;
      margin: 15px 0 10px 0;
    }

    .timeline-notes.markdown-body strong,
    .timeline-notes.markdown-body b,
    .timeline-notes strong,
    .timeline-notes b {
      color: inherit;
      font-weight: 700;
    }

    .timeline-notes.markdown-body code,
    .timeline-notes code {
      background: var(--gray-100);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
    }

    /* 預覽面板 */
    .studio-preview {
      display: flex !important;
      flex-direction: column;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      min-width: 0;
    }

    /* 移除 preview-header，不再需要 */

    .preview-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    /* 簡報式預覽樣式 */
    .preview-single {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .presentation-card {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 固定頂部區域（形音義）- 極致緊湊設計 */
    .presentation-header {
      flex-shrink: 0;
      background: var(--gray-50);
      border-bottom: 2px solid var(--gray-200);
      padding: var(--space-1) var(--space-4); /* 極小 padding，只保留左右 */
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* 從 center 改為 flex-start，讓內容貼頂 */
      align-items: center;
    }

    /* 可滾動內容區域 */
    .presentation-scrollable {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-6) var(--space-8);
      background: var(--bg-card);
    }

    /* 簡報式字體大小（適合65寸電視投影片模式）- 極致緊湊 */
    .presentation-char {
      font-size: 64px;
      font-weight: 700;
      text-align: center;
      color: var(--primary);
      margin: 0; /* 移除上下 margin */
      line-height: 1.1; /* 從 1.2 減少到 1.1 */
    }

    .presentation-char img {
      height: 64px !important;
      width: auto !important;
    }

    .presentation-pinyin {
      font-size: 56px; /* 從 64px 稍微減小 */
      text-align: center;
      color: #dc2626;
      margin: 0; /* 移除上下 margin */
      line-height: 1.1;
      font-weight: 600;
    }

    .presentation-meaning {
      font-size: 56px; /* 從 64px 稍微減小 */
      text-align: center;
      color: #059669;
      margin: 0; /* 移除上下 margin */
      line-height: 1.1;
      font-weight: 500;
    }

    /* 可滾動內容區域 - 字體增大，與固定區塊接近 */
    .presentation-content {
      font-size: 2rem; /* 32px，接近固定區塊的字體大小 */
      line-height: 1.8;
    }

    .presentation-content h1 {
      font-size: 3rem; /* 48px */
      line-height: 1.4;
      margin: var(--space-4) 0 var(--space-2);
    }

    .presentation-content h2 {
      font-size: 2.5rem; /* 40px */
      line-height: 1.4;
      margin: var(--space-3) 0 var(--space-2);
    }

    .presentation-content h3 {
      font-size: 2rem; /* 32px */
      line-height: 1.4;
      margin: var(--space-2) 0;
    }

    .presentation-content p {
      font-size: 2rem; /* 32px */
      line-height: 1.8;
      margin: var(--space-3) 0;
    }

    .presentation-content ul,
    .presentation-content ol {
      font-size: 2rem; /* 32px */
      line-height: 1.8;
      margin: var(--space-3) 0;
    }

    .presentation-content li {
      margin: var(--space-2) 0;
    }

    .presentation-content strong,
    .presentation-content b {
      font-weight: 700;
    }

    .presentation-content code {
      font-size: 1.75rem; /* 28px */
      background: var(--gray-100);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
    }

    .presentation-content img {
      max-width: 100%;
      border-radius: var(--radius-lg);
      margin: var(--space-4) 0;
    }

    /* 美化滾動條（可滾動區域） */
    .presentation-scrollable::-webkit-scrollbar {
      width: 8px;
    }

    .presentation-scrollable::-webkit-scrollbar-track {
      background: var(--gray-100);
    }

    .presentation-scrollable::-webkit-scrollbar-thumb {
      background: var(--gray-300);
      border-radius: 4px;
    }

    .presentation-scrollable::-webkit-scrollbar-thumb:hover {
      background: var(--gray-400);
    }

    /* 點擊卡片標題區域 */
    .form-item-header {
      cursor: pointer;
      user-select: none;
    }

    .form-item-header:hover {
      background: var(--gray-100);
      border-radius: var(--radius-md);
      padding: var(--space-1);
      margin: calc(-1 * var(--space-1));
    }


    /* 拖拽手柄 */
    .drag-handle {
      cursor: move;
      color: var(--gray-400);
      font-size: var(--text-lg);
      padding: var(--space-1);
    }

    .drag-handle:hover {
      color: var(--gray-600);
    }

    .form-item.dragging {
      opacity: 0.5;
    }

    .timeline-card.dragging {
      opacity: 0.5;
    }

    /* 折疊/展開按鈕 */
    .collapse-toggle {
      padding: var(--space-1) var(--space-2);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--gray-500);
      font-size: var(--text-sm);
      border-radius: var(--radius-md);
      transition: all var(--duration-fast) var(--ease-out);
      min-width: 24px;
    }

    .collapse-toggle:hover {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    /* 表單項目折疊狀態 */
    .form-item.collapsed .form-item-body {
      display: none;
    }

    .form-item.collapsed .form-item-header {
      margin-bottom: 0;
    }

    /* 標題區域的發布按鈕樣式 */
    .form-item-header .checkbox-group {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .form-item-header .checkbox-group input[type="checkbox"] {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    .form-item-header .checkbox-group label {
      margin: 0;
      font-size: var(--text-xs);
      color: var(--gray-600);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    /* 確保「字」欄位始終可見（即使在折疊狀態） */
    .character-group {
      display: block !important;
    }

    /* 全部折疊/展開按鈕 */
    #collapse-all-btn,
    #expand-all-btn {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--gray-300);
      background: var(--bg-card);
      color: var(--gray-700);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }

    #collapse-all-btn:hover,
    #expand-all-btn:hover {
      background: var(--gray-100);
      border-color: var(--gray-400);
      color: var(--gray-900);
    }

    /* 可調整寬度的拉條 */
    .resizer {
      width: 4px;
      background: var(--gray-200);
      cursor: col-resize;
      position: relative;
      transition: background var(--duration-fast) var(--ease-out);
      z-index: 10;
    }

    .resizer:hover {
      background: var(--primary);
    }

    .resizer::before {
      content: '';
      position: absolute;
      left: -2px;
      top: 0;
      bottom: 0;
      width: 8px;
      cursor: col-resize;
    }

    .resizer.dragging {
      background: var(--primary);
    }

    /* 模式切換器樣式 */
    .mode-switcher {
      display: flex;
      gap: var(--space-2);
    }

    .mode-btn {
      padding: var(--space-1) var(--space-3);
      border: 1px solid var(--gray-300);
      background: var(--bg-card);
      color: var(--gray-700);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
      white-space: nowrap;
    }

    .mode-btn:hover {
      background: var(--gray-100);
      border-color: var(--gray-400);
    }

    .mode-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .mode-content {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .preview-mode {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="studio-container">
    <!-- 合併導航欄 -->
    <div class="studio-navbar">
      <div class="navbar-selectors">
        <div class="level-selector">
          <label for="level-select">等級:</label>
          <select id="level-select">
            <option value="btc1">BCT 1</option>
            <option value="btc2">BCT 2</option>
            <option value="btc3">BCT 3</option>
          </select>
        </div>
        <div class="level-selector">
          <label for="lesson-select">課次:</label>
          <select id="lesson-select">
            <option value="">選擇課次...</option>
            <option value="lesson1">Lesson 1</option>
            <option value="lesson2">Lesson 2</option>
            <option value="lesson3">Lesson 3</option>
            <option value="lesson4">Lesson 4</option>
            <option value="lesson5">Lesson 5</option>
            <option value="lesson6">Lesson 6</option>
            <option value="lesson7">Lesson 7</option>
            <option value="lesson8">Lesson 8</option>
            <option value="lesson9">Lesson 9</option>
            <option value="lesson10">Lesson 10</option>
            <option value="lesson11">Lesson 11</option>
            <option value="lesson12">Lesson 12</option>
            <option value="lesson13">Lesson 13</option>
            <option value="lesson14">Lesson 14</option>
            <option value="lesson15">Lesson 15</option>
            <option value="lesson16">Lesson 16</option>
            <option value="lesson17">Lesson 17</option>
            <option value="lesson18">Lesson 18</option>
            <option value="lesson19">Lesson 19</option>
            <option value="lesson20">Lesson 20</option>
          </select>
        </div>
      </div>
      <div class="navbar-divider"></div>
      <div class="navbar-modes">
        <button class="mode-btn active" data-mode="component">📦 部件與目標字</button>
        <button class="mode-btn" data-mode="vocab">⚡ 快速補充生詞</button>
        <button class="mode-btn" data-mode="note">📝 Live Note</button>
        <button class="mode-btn" data-mode="grammar">📚 Grammar</button>
        <button class="mode-btn" data-mode="practice">✏️ Practice</button>
      </div>
    </div>

    <div class="studio-layout" id="studio-layout">
      <!-- 左側：編輯面板 -->
      <div class="studio-editor" id="studio-editor">
        <!-- 部件與目標字模式 -->
        <div id="component-mode" class="mode-content">
          <div class="editor-header">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <h2>編輯表單</h2>
              <div class="level-selector" style="margin-left: var(--space-2);">
                <label for="type-select" style="margin-right: var(--space-1);">類型:</label>
                <select id="type-select" style="padding: var(--space-1) var(--space-2); border: 1px solid var(--gray-300); border-radius: var(--radius-md); font-size: var(--text-sm);">
                  <option value="component">部件</option>
                  <option value="target-character">目標字</option>
                </select>
              </div>
              <button class="btn-icon" id="collapse-all-btn" title="全部折疊">全部折疊</button>
              <button class="btn-icon" id="expand-all-btn" title="全部展開">全部展開</button>
              <button class="btn-icon" id="batch-publish-btn" title="全部發布" style="background: var(--success, #16a34a); color: white; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-semibold);">✅ 全部發布</button>
              <button class="btn-icon" id="batch-unpublish-btn" title="全部取消發布" style="background: var(--gray-200); color: var(--gray-700); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-semibold);">⛔ 全部取消發布</button>
            </div>
            <button class="btn-icon" id="add-component-btn" title="添加新項目" style="background: var(--primary); color: white; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-semibold);">
              + 新增
            </button>
          </div>
          <div class="editor-content">
            <div class="form-list" id="form-list">
              <!-- 表單項目將由 JavaScript 動態生成 -->
            </div>
          </div>
        </div>

        <!-- 快速補充生詞模式 -->
        <div id="vocab-mode" class="mode-content" style="display: none;">
          <div class="editor-header">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <h2>⚡ 快速補充生詞 - Taigen A 班</h2>
              <button class="btn-icon" id="vocab-collapse-all-btn" title="全部折疊">全部折疊</button>
              <button class="btn-icon" id="vocab-expand-all-btn" title="全部展開">全部展開</button>
            </div>
            <button class="btn-icon" id="vocab-new-btn" title="添加新項目" style="background: var(--primary); color: white; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-semibold);">
              + 新增生詞
            </button>
          </div>
          <div class="editor-content">
            <div class="form-list" id="vocab-list">
              <!-- 生詞卡片將由 JavaScript 動態生成 -->
            </div>
          </div>
        </div>

        <!-- Live Note 模式 -->
        <div id="note-mode" class="mode-content" style="display: none;">
          <div class="editor-header">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <h2>📝 Live Note</h2>
              <button class="btn-icon" id="note-collapse-all-btn" title="全部折疊">全部折疊</button>
              <button class="btn-icon" id="note-expand-all-btn" title="全部展開">全部展開</button>
            </div>
            <button class="btn-icon" id="note-new-btn" title="添加新項目" style="background: var(--primary); color: white; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-semibold);">
              + 新增筆記
            </button>
          </div>
          <div class="editor-content">
            <div class="form-list" id="note-list">
              <!-- 筆記卡片將由 JavaScript 動態生成 -->
            </div>
          </div>
        </div>

        <!-- Grammar 模式 -->
        <div id="grammar-mode" class="mode-content" style="display: none;">
          <div class="editor-header">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <h2>📚 Grammar 管理</h2>
              <button class="btn-icon" id="grammar-collapse-all-btn" title="全部折疊">全部折疊</button>
              <button class="btn-icon" id="grammar-expand-all-btn" title="全部展開">全部展開</button>
            </div>
            <button class="btn-icon" id="grammar-new-btn" title="添加新項目" style="background: var(--primary); color: white; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-semibold);">
              + 新增文法
            </button>
          </div>
          <div class="editor-content">
            <div class="form-list" id="grammar-list">
              <!-- 文法卡片將由 JavaScript 動態生成 -->
            </div>
          </div>
        </div>

        <!-- Practice 模式 -->
        <div id="practice-mode" class="mode-content" style="display: none;">
          <div class="editor-header">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <h2>✏️ Practice 管理</h2>
              <button class="btn-icon" id="practice-collapse-all-btn" title="全部折疊">全部折疊</button>
              <button class="btn-icon" id="practice-expand-all-btn" title="全部展開">全部展開</button>
            </div>
            <button class="btn-icon" id="practice-new-btn" title="添加新項目" style="background: var(--primary); color: white; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-semibold);">
              + 新增練習
            </button>
          </div>
          <div class="editor-content">
            <div class="form-list" id="practice-list">
              <!-- 練習卡片將由 JavaScript 動態生成 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 可調整寬度的拉條 -->
      <div class="resizer" id="studio-resizer"></div>

      <!-- 右側：預覽面板 -->
      <div class="studio-preview">
        <div class="preview-content" id="preview-content">
          <!-- 部件與目標字預覽 -->
          <div id="component-preview" class="preview-mode">
            <div class="preview-single" id="preview-single">
              <!-- 簡報式預覽將由 JavaScript 動態生成 -->
            </div>
          </div>
          <!-- 快速補充生詞預覽 -->
          <div id="vocab-preview" class="preview-mode" style="display: none;">
            <div class="preview-single" id="vocab-preview-content">
              <div style="padding: 40px; text-align: center; color: var(--muted);">請在左側輸入生詞以查看預覽</div>
            </div>
          </div>
          <!-- Live Note 預覽 -->
          <div id="note-preview" class="preview-mode" style="display: none;">
            <div class="preview-single" id="note-preview-content" style="padding: 20px;">
              <div style="padding: 40px; text-align: center; color: var(--muted);">請在左側輸入內容以查看預覽</div>
            </div>
          </div>
          <!-- Grammar 預覽 -->
          <div id="grammar-preview" class="preview-mode" style="display: none;">
            <div class="preview-single" id="grammar-preview-content" style="padding: 20px;">
              <div style="padding: 40px; text-align: center; color: var(--muted);">請在左側輸入內容以查看預覽</div>
            </div>
          </div>
          <!-- Practice 預覽 -->
          <div id="practice-preview" class="preview-mode" style="display: none;">
            <div class="preview-single" id="practice-preview-content" style="padding: 20px;">
              <div style="padding: 40px; text-align: center; color: var(--muted);">請在左側輸入內容以查看預覽</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <!-- Cloudinary Upload Widget -->
  <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

  <!-- 應用腳本 -->
  <script src="assets/js/firestore.js"></script>
  <script src="assets/js/markdown-renderer.js"></script>
  <script src="assets/js/markdown-shortcuts.js"></script>
  <script src="studio.js"></script>
</body>
</html>
