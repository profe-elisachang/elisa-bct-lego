<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lego - Build Your Fluency Brick by Brick</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/nav-global.css">
    <style>
        /* Hero Header */
        .hero-header {
            background: #ff9a56;
            border-radius: 16px;
            padding: 0 35px;
            margin-bottom: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 8px 25px rgba(255, 154, 86, 0.25);
            overflow: visible;
            position: relative;
            height: 180px;
        }

        .hero-content {
            flex: 1;
        }

        .hero-content h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 0;
            font-weight: 800;
            line-height: 1.3;
        }

        .hero-image {
            flex-shrink: 0;
            position: absolute;
            right: 25px;
            top: -120px;
        }

        .hero-image img {
            width: 360px;
            height: auto;
            display: block;
        }

        /* Motto Card */
        .motto-card {
            background: white;
            border-radius: 20px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            max-width: 800px;
            margin: -40px auto 60px;
            position: relative;
            z-index: 10;
        }

        .motto-card h2 {
            font-size: 1.8rem;
            color: #ff6b35;
            margin-bottom: 30px;
            font-weight: 700;
            font-style: italic;
        }

        .motto-list {
            font-size: 1.1rem;
            color: #444;
            line-height: 2;
            margin-bottom: 30px;
        }

        .motto-list p {
            margin-bottom: 12px;
            padding-left: 12px;
            border-left: 3px solid #ffcba4;
            text-align: left;
        }

        .motto-highlight {
            font-size: 1.25rem;
            color: #ff6b35;
            font-weight: 700;
            font-style: italic;
            margin-top: 30px;
            padding: 20px;
            background: #fff5f0;
            border-radius: 12px;
            border-left: 4px solid #ff6b35;
        }

        /* Course Entry Buttons */
        .course-entry {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 35px;
        }

        .course-entry-btn {
            padding: 15px 35px;
            background: #ff6b35;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
        }

        .course-entry-btn:hover {
            background: #e85d2a;
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(255, 107, 53, 0.35);
        }

        @media (max-width: 768px) {
            .hero-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 20px 20px 0;
                height: auto;
                margin-bottom: 60px;
            }

            .hero-content h1 {
                font-size: 1.3rem;
            }

            .hero-image {
                position: relative;
                right: auto;
                top: auto;
                margin-bottom: -40px;
            }

            .hero-image img {
                width: 200px;
            }

            .motto-card {
                padding: 30px 25px;
                margin: -20px 20px 40px;
            }

            .motto-card h2 {
                font-size: 1.3rem;
                margin-bottom: 20px;
            }

            .motto-list {
                font-size: 0.95rem;
            }

            .motto-list p {
                padding-left: 8px;
            }

            .motto-highlight {
                font-size: 1.05rem;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero Header -->
        <section class="hero-header">
            <div class="hero-content">
                <h1>Chinese Lego – Build Your Fluency Brick by Brick</h1>
            </div>
            <div class="hero-image">
                <img src="assets/img/header.meeting.png" alt="Chinese Lego">
            </div>
        </section>

        <!-- Motto Card -->
        <section class="motto-card">
            <h2>Progress, not perfection.</h2>
            <div class="motto-list">
                <p>Dare to speak, we move forward.</p>
                <p>Not everything at once—just a little more each day.</p>
                <p>Forget it? Meet again until it feels like an old friend.</p>
            </div>
            <div class="motto-highlight">
                "I can say a bit more today."
            </div>
            
            <!-- Course Entry Buttons -->
            <div class="course-entry">
                <a href="lesson-template-b.html?level=btc1&lesson=L1" class="course-entry-btn">BCT 1</a>
                <a href="lesson-template-b.html?level=btc2&lesson=L1" class="course-entry-btn">BCT 2</a>
                <a href="lesson-template-b.html?level=btc3&lesson=L1" class="course-entry-btn">BCT 3</a>
            </div>
        </section>
    </div>

    <script src="assets/js/course-config.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/cohort-selector.js"></script>
    
    <!-- 动态更新 BCT 按钮的 cohort 参数 -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const cohort = localStorage.getItem('bct-cohort') || 'taigen-a';
        const buttons = document.querySelectorAll('.course-entry-btn');
        
        buttons.forEach(btn => {
            const currentHref = btn.getAttribute('href');
            // 添加 cohort 参数
            btn.setAttribute('href', currentHref + `&cohort=${cohort}`);
        });
        
        console.log('✅ 首页 BCT 按钮已更新，当前班级：', cohort);
    });
    </script>
</body>
</html>
